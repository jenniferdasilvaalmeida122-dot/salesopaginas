name: Publicar Rotina Glow Up no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar e verificar os arquivos públicos
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s style.css
          test -s script.js
          test -s premium.css
          test -s premium.js
          test -s assets/logo.png
          mkdir -p "$RUNNER_TEMP/site"
          cp index.html style.css script.js premium.css premium.js "$RUNNER_TEMP/site/"
          cp -R assets "$RUNNER_TEMP/site/assets"
          touch "$RUNNER_TEMP/site/.nojekyll"
      - name: Enviar o site para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site
      - name: Aguardar disponibilidade do artefato
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq "[.artifacts[] | select(.name == \"$ARTIFACT_NAME\" and .expired == false)] | length")
            if [ "$count" = 1 ]; then exit 0; fi
            sleep 5
          done
          echo "O artefato ainda não está disponível na API do GitHub."
          exit 1
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
